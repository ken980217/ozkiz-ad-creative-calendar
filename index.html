<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZKIZ · 비주얼 갤러리</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FB; --surface:#FFFFFF; --surface2:#F2F2F8;
  --border:rgba(107,95,228,.12); --border2:rgba(107,95,228,.2);
  --accent:#7F77DD; --accent-light:#EEEDFE; --accent-dark:#534AB7;
  --red:#E05252; --red-light:#FDEDEB;
  --green:#2DA882; --green-light:#E3F5EF;
  --amber:#D97706; --amber-light:#FEF3C7;
  --text:#1A1830; --muted:#8A88AA;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:1.6rem 1.6rem 4rem;}

/* header */
.hdr{margin-bottom:1.2rem;}
.hdr .eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.hdr h1{font-size:22px;font-weight:700;margin:0 0 3px;}
.hdr .sub{font-size:13px;color:var(--muted);}
.purchase-note{display:flex;align-items:center;gap:6px;background:var(--green-light);border:1px solid #A8DDCA;color:#1A7A5E;font-size:12.5px;font-weight:600;border-radius:10px;padding:9px 13px;margin-bottom:1rem;}

/* metric row */
.metrics{display:flex;gap:10px;margin:1rem 0 1.2rem;flex-wrap:wrap;}
.metric{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;box-shadow:0 1px 4px rgba(107,95,228,.06);}
.metric .l{font-size:11px;color:var(--muted);margin-bottom:4px;}
.metric .v{font-size:22px;font-weight:700;}
.metric .v.green{color:var(--green);}
.metric .v.amber{color:var(--amber);}
.metric .v.accent{color:var(--accent);}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem;box-shadow:0 1px 4px rgba(107,95,228,.06);}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:2px;}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;}
.seg button.active{background:var(--accent);color:#fff;}
.btn{border:none;border-radius:8px;font-weight:600;font-size:12.5px;padding:7px 13px;cursor:pointer;background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 2px 10px rgba(127,119,221,.3);}
.btn.primary:hover{background:var(--accent-dark);color:#fff;}
.btn.danger{background:var(--red-light);color:#9B1C1C;border:1px solid #F5BCBA;}
.spacer{flex:1;}
.input,select{border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);font-size:12.5px;padding:7px 10px;font-family:inherit;}
.input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,119,221,.15);}
.monthlabel{font-size:14px;font-weight:700;min-width:92px;text-align:center;}

/* tag */
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:100px;white-space:nowrap;}
.tag.purple{background:var(--accent-light);color:var(--accent-dark);border:1px solid var(--border2);}
.tag.green{background:var(--green-light);color:#1A7A5E;border:1px solid #A8DDCA;}
.tag.red{background:var(--red-light);color:#9B1C1C;border:1px solid #F5BCBA;}
.tag.amber{background:var(--amber-light);color:#92400E;border:1px solid #FBBF82;}
.tag.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--border2);}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(107,95,228,.06);}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--border);}
.cal-week div{padding:8px 0;text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;position:relative;transition:background .1s;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.other{background:#FBFBFD;}
.cal-cell.dragover{background:var(--accent-light);}
.cal-cell .daynum{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.cal-cell.today .daynum{color:var(--accent);}
.cal-cell.today .daynum span.n{background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;}
.cal-cell .addbtn{opacity:0;cursor:pointer;color:var(--accent);font-weight:700;font-size:13px;}
.cal-cell:hover .addbtn{opacity:1;}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px 5px;margin-bottom:3px;cursor:grab;font-size:10.8px;}
.chip:hover{border-color:var(--accent);}
.chip .thumb{width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--surface2);}
.chip .thumb.novideo{display:flex;align-items:center;justify-content:center;font-size:11px;}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* table */
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(107,95,228,.06);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{background:var(--surface2);text-align:left;padding:9px 10px;font-size:11px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row:hover{background:var(--surface2);cursor:pointer;}
.rowthumb{width:52px;height:36px;border-radius:6px;object-fit:cover;background:var(--surface2);}
.rowthumb.novideo{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);}
.actionlink{font-size:11.5px;color:var(--muted);text-decoration:none;margin-right:8px;}
.actionlink:hover{color:var(--accent);}
.actionlink.del:hover{color:var(--red);}

.empty{text-align:center;padding:2.6rem 1rem;color:var(--muted);font-size:13px;}
.empty .ic{font-size:26px;margin-bottom:8px;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(26,24,48,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 12px 40px rgba(26,24,48,.25);}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem;border-bottom:1px solid var(--border);}
.modal-hd h3{margin:0;font-size:15px;font-weight:700;}
.modal-hd .x{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;}
.modal-bd{padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:12px;}
.modal-ft{display:flex;gap:8px;justify-content:space-between;padding:1rem 1.3rem;border-top:1px solid var(--border);}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:5px;}
.field input[type=text],.field input[type=date],.field textarea{width:100%;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;padding:8px 10px;font-family:inherit;}
.field textarea{resize:vertical;min-height:56px;}
.field select{width:100%;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.dropzone{border:1.5px dashed var(--border2);border-radius:10px;background:var(--surface2);padding:1.1rem;text-align:center;cursor:pointer;transition:.15s;}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-light);}
.dropzone .ic{font-size:22px;margin-bottom:4px;}
.dropzone .t1{font-size:12.5px;font-weight:600;}
.dropzone .t2{font-size:11px;color:var(--muted);margin-top:2px;}
.preview{position:relative;border-radius:10px;overflow:hidden;background:#000;}
.preview video,.preview img{width:100%;max-height:260px;display:block;object-fit:contain;background:#000;}
.preview .rm{position:absolute;top:8px;right:8px;background:rgba(26,24,48,.6);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;padding:5px 9px;cursor:pointer;}
.filename{font-size:11px;color:var(--muted);margin-top:5px;}
.focus-picker{position:relative;border-radius:10px;overflow:hidden;cursor:crosshair;user-select:none;background:#000;max-height:280px;overflow-y:auto;}
.focus-picker img{display:block;width:100%;height:auto;}
.slide-thumbs{display:flex;flex-wrap:wrap;gap:8px;}
.slide-thumb-item{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);}
.slide-thumb-item img{width:100%;height:100%;object-fit:cover;display:block;}
.slide-thumb-num{position:absolute;left:4px;bottom:3px;background:rgba(26,24,48,.6);color:#fff;font-size:9.5px;font-weight:700;border-radius:100px;padding:1px 6px;}
.slide-thumb-rm{position:absolute;top:3px;right:3px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(26,24,48,.65);color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.slide-thumb-rm:hover{background:var(--red);}
.slide-thumb-add{width:74px;height:74px;border-radius:8px;border:1.5px dashed var(--border2);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:10.5px;}
.slide-thumb-add:hover{border-color:var(--accent);color:var(--accent);}
.slide-thumb-add .ic{font-size:16px;}
.focus-dot{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.45);background:rgba(127,119,221,.55);transform:translate(-50%,-50%);pointer-events:none;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:100px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}

/* gallery */
.datestrip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(107,95,228,.06);}
.ds-toprow{display:flex;justify-content:flex-end;margin-bottom:8px;}
.seg.small button{padding:5px 11px;font-size:11.5px;}
.ds-row{display:flex;flex-wrap:wrap;gap:6px;}
.ds-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:38px;height:38px;border-radius:9px;background:var(--surface2);cursor:pointer;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0;position:relative;}
.ds-chip:hover{background:var(--accent-light);}
.ds-chip.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.ds-chip.selected{background:var(--accent);color:#fff;}
.ds-chip .wd{font-size:8px;color:var(--muted);font-weight:700;line-height:1;}
.ds-chip.selected .wd{color:rgba(255,255,255,.85);}
.ds-chip .dsdot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:3px;}
.ds-chip.selected .dsdot{background:#fff;}
.gallery-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.gallery-hdr .t{font-size:14px;font-weight:700;}
.gallery-hdr .clear{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
.gallery-daygroup{margin-bottom:20px;}
.gallery-daygroup .dh{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px 2px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,190px));gap:12px;}
.gitem{position:relative;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);cursor:grab;aspect-ratio:1;transition:opacity .15s,outline .1s;}
.gitem:hover{border-color:var(--accent);}
.gitem.dragging{opacity:.35;cursor:grabbing;}
.gitem.drag-over{outline:2.5px solid var(--accent);outline-offset:-2.5px;}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;}
.gitem .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);}
.gitem .play{position:absolute;top:7px;right:7px;background:rgba(26,24,48,.6);color:#fff;font-size:12px;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.gitem .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 8px 7px;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,0));color:#fff;}
.gitem .cap .tt{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gitem .cap .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:nowrap;overflow:hidden;}
.gitem .cap .tags .tag{white-space:nowrap;flex-shrink:0;font-size:9.5px;padding:1.5px 6px;}
.gitem.purchased{outline:2.5px solid var(--green);outline-offset:-2.5px;}
.gitem .purchase-chk{position:absolute;top:6px;left:6px;z-index:3;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:rgba(26,24,48,.55);border-radius:7px;cursor:pointer;}
.gitem .purchase-chk:hover{background:rgba(26,24,48,.75);}
.gitem.purchased .purchase-chk{background:var(--green);}
.gitem .purchase-chk input{width:16px;height:16px;cursor:pointer;accent-color:var(--green);}
.gitem .slide-badge{position:absolute;top:7px;right:7px;background:rgba(26,24,48,.6);color:#fff;font-size:10px;font-weight:700;border-radius:100px;padding:2px 8px;}
.gitem .slide-nav{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:rgba(26,24,48,.5);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s,background .12s;z-index:3;}
.gitem:hover .slide-nav{opacity:1;}
.gitem .slide-nav:hover{background:rgba(26,24,48,.8);}
.gitem .slide-nav.prev{left:6px;}
.gitem .slide-nav.next{right:6px;}
.gitem .slide-dots{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:3px;}
.gitem .slide-dots .sdot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);}
.gitem .slide-dots .sdot.on{background:#fff;}

/* lightbox */
#lightbox{background:rgba(10,9,20,.92);}
.lightbox-inner{max-width:92vw;max-height:94vh;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;}
.lb-close{position:absolute;top:-44px;right:0;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer;}
.lb-close:hover{background:rgba(255,255,255,.22);}
.lb-media{display:flex;align-items:center;justify-content:center;max-width:92vw;max-height:74vh;}
.lb-media video,.lb-media img{max-width:92vw;max-height:74vh;border-radius:12px;background:#000;object-fit:contain;display:block;}
.lb-info{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center;max-width:90vw;}
.lb-title{font-size:15px;font-weight:700;}
.lb-meta{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;}
.lb-slide-wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:92vw;max-height:74vh;}
.lb-slide-wrap img{max-width:92vw;max-height:74vh;border-radius:12px;background:#000;object-fit:contain;display:block;}
.lb-slide-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(26,24,48,.55);color:#fff;font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:background .12s,transform .12s;}
.lb-slide-nav:hover{background:rgba(127,119,221,.85);border-color:#fff;transform:translateY(-50%) scale(1.06);}
.lb-slide-nav:active{transform:translateY(-50%) scale(.96);}
.lb-slide-nav.prev{left:-14px;}
.lb-slide-nav.next{right:-14px;}
@media (max-width: 640px){
  .lb-slide-nav.prev{left:6px;}
  .lb-slide-nav.next{right:6px;}
}
.lb-slide-count{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(26,24,48,.6);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<div class="wrap">

  <div class="hdr">
    <div class="eyebrow">VISUAL GALLERY</div>
    <h1>비주얼 갤러리</h1>
    <div class="sub">날짜를 클릭해 그날 만든 이미지·영상을 모아보세요 · 이 브라우저에 저장됩니다</div>
  </div>

  <div class="purchase-note">✅ 구매가 일어난 소재는 체크해주세요</div>

  <div class="metrics" id="metrics"></div>

  <div class="toolbar">
    <div class="seg">
      <button id="viewGalBtn" class="active">🖼 갤러리</button>
      <button id="viewCalBtn">▦ 캘린더</button>
      <button id="viewTblBtn">☰ 표</button>
    </div>
    <div id="calNav" style="display:flex;align-items:center;gap:6px;">
      <button class="btn" id="prevBtn">←</button>
      <button class="btn" id="todayBtn">오늘</button>
      <button class="btn" id="nextBtn">→</button>
      <div class="monthlabel" id="monthLabel"></div>
    </div>
    <input class="input" id="searchInput" placeholder="🔍 제목·캠페인 검색" style="width:170px;">
    <select id="filterType"><option value="">전체 유형</option></select>
    <select id="filterStatus"><option value="">전체 상태</option></select>
    <div class="spacer"></div>
    <button class="btn" id="exportBtn">⬇ CSV 내보내기</button>
    <button class="btn primary" id="addBtn">＋ 소재 추가</button>
  </div>

  <div id="galView">
    <div class="datestrip">
      <div class="ds-toprow">
        <div class="seg small">
          <button id="modeWeekBtn" class="active">주별로 보기</button>
          <button id="modeDayBtn">일별로 보기</button>
        </div>
      </div>
      <div class="ds-row" id="dsRow"></div>
    </div>
    <div id="galMain"></div>
  </div>
  <div id="calView" class="cal" style="display:none;"></div>
  <div id="tblView" class="tblwrap" style="display:none;"></div>

</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hd">
      <h3 id="modalTitle">소재 추가</h3>
      <button class="x" id="closeModal">✕</button>
    </div>
    <div class="modal-bd">
      <div id="mediaArea"></div>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">

      <div class="row2">
        <div class="field"><label>일자 *</label><input type="date" id="f_date"></div>
        <div class="field"><label>유형</label>
          <select id="f_type">
            <option>이미지</option><option>비디오</option><option>슬라이드 광고</option>
          </select>
        </div>
      </div>
      <div class="field"><label>제목 *</label><input type="text" id="f_title" placeholder="예: 여름 원피스_후킹A_0730"></div>
      <div class="row2">
        <div class="field"><label>캠페인·제품</label><input type="text" id="f_campaign" placeholder="예: 여름신상 원피스"></div>
        <div class="field"><label>매체</label>
          <select id="f_platform"><option>메타</option><option>네이버 GFA</option><option>카카오</option><option>틱톡</option><option>기타</option></select>
        </div>

      <div class="row3">

          <select id="f_status"><option>기획</option><option>제작중</option><option>검수중</option><option>게시완료</option><option>보류</option></select>

<div class="toast" id="toast"></div>

<script>
/* ---------- Firebase (shared cloud sync so every device sees the same creatives) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyB52OfUSi3leWVrbigAr7aZH6RYHWqt8_8",
  authDomain: "ozkiz-ad-calendar.firebaseapp.com",
  projectId: "ozkiz-ad-calendar",
  storageBucket: "ozkiz-ad-calendar.firebasestorage.app",
  messagingSenderId: "854719121979",
  appId: "1:854719121979:web:cccfd0ff4d3d06f1f72a1e"
};
firebase.initializeApp(firebaseConfig);
const fsdb = firebase.firestore();
fsdb.settings({ ignoreUndefinedProperties: true }); // some fields (e.g. focusX/Y on media-less items) may be unset
const creativesCol = fsdb.collection('creatives');

/* ---------- Local blob cache (per-browser only) ----------
   Firebase Storage (for hosting the original video/image files) requires a paid plan,
   so original video/image files are NOT synced across devices. Instead:
   - Every device shares the same item list + thumbnail images via Firestore (free).
   - The browser that originally uploaded a file also caches the full-resolution
     blob locally, so playback/edit on that device still uses the original quality.
   - Other devices simply display the synced thumbnail (and, for video, a poster frame). */
const BLOB_DB_NAME = 'ozkizAdCreativeCalendarBlobs', BLOB_STORE = 'blobs';
let blobDb;
function openBlobDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(BLOB_DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains(BLOB_STORE)) d.createObjectStore(BLOB_STORE,{keyPath:'id'});
    };
    req.onsuccess = e => { blobDb = e.target.result; resolve(blobDb); };
    req.onerror = e => reject(e);
  });
}
function blobStore(mode){ return blobDb.transaction(BLOB_STORE, mode).objectStore(BLOB_STORE); }
function putBlobLocal(id, blob, mediaType, mediaName){ return new Promise((res,rej)=>{ const r=blobStore('readwrite').put({id, blob, mediaType, mediaName}); r.onsuccess=()=>res(); r.onerror=rej; }); }
function getBlobLocal(id){ return new Promise((res,rej)=>{ const r=blobStore('readonly').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=rej; }); }
function delBlobLocal(id){ return new Promise((res,rej)=>{ const r=blobStore('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=rej; }); }

/* ---------- Firestore data access (call sites elsewhere in the app are unchanged) ---------- */
function getAll(){ return items.slice(); }
async function putItem(item){
  const { blob, ...rest } = item;
  await creativesCol.doc(item.id).set(rest);
}
async function delItem(id){
  await creativesCol.doc(id).delete();
  try{ await delBlobLocal(id); }catch(e){ /* ignore */ }
}

/* one-time: bring this browser's existing (pre-cloud-sync) local data up into Firestore,
   so creatives that were only ever saved in ken's browser become visible to everyone. */
async function migrateFromOldIndexedDB(){
  if(localStorage.getItem('migratedToFirestoreV1')) return;
  try{
    const oldDb = await new Promise((res)=>{
      const req = indexedDB.open('ozkizAdCreativeCalendar', 1);
      req.onsuccess = e => res(e.target.result);
      req.onerror = () => res(null);
    });
    if(!oldDb || !oldDb.objectStoreNames.contains('creatives')){ localStorage.setItem('migratedToFirestoreV1','1'); return; }
    const oldItems = await new Promise((res,rej)=>{
      const tx = oldDb.transaction('creatives','readonly');
      const r = tx.objectStore('creatives').getAll();
      r.onsuccess = () => res(r.result); r.onerror = rej;
    });
    if(!oldItems.length){ localStorage.setItem('migratedToFirestoreV1','1'); return; }
    const snap = await creativesCol.limit(1).get();
    if(!snap.empty){ localStorage.setItem('migratedToFirestoreV1','1'); return; }
    for(const it of oldItems){
      if(it.blob){ try{ await putBlobLocal(it.id, it.blob, it.mediaType, it.mediaName); }catch(e){ /* ignore */ } }
      const { blob, ...rest } = it;
      await creativesCol.doc(it.id).set(rest);
    }
    localStorage.setItem('migratedToFirestoreV1','1');
    showToast(oldItems.length+'개 소재를 서버로 이전했어요');
  }catch(e){ console.error('migration failed', e); }
}

/* ---------- State ---------- */
let items = [];
let view = 'gallery'; // 'gallery' | 'cal' | 'tbl'
let curYear, curMonth; // 0-indexed month
let gallerySelectedDate = null;
let dateGroupMode = 'week'; // 'week' | 'day'
let editingId = null;
let pendingBlob = null, pendingThumb = null, pendingMediaType = null, pendingFileName = null, mediaRemoved = false;
let pendingFocusX = 50, pendingFocusY = 50;
let pendingSlides = [];
let slideIndex = {}; // in-memory current-slide-index per item id, for gallery thumbnail paging
let lbSlideIndex = 0;

const TYPE_COLORS = {'이미지':'purple','비디오':'green','슬라이드 광고':'amber'};
const STATUS_COLORS = {'기획':'gray','제작중':'amber','검수중':'purple','게시완료':'green','보류':'red'};

function uuid(){ return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Init ---------- */
let didInitialMaintenance = false;
async function init(){
  await openBlobDB();
  const now = new Date();
  curYear = now.getFullYear(); curMonth = now.getMonth();
  populateFilterOptions();
  bindEvents();
  await migrateFromOldIndexedDB();
  creativesCol.onSnapshot(async snap=>{
    const docs = snap.docs.map(d=>d.data());
    for(const it of docs){
      if(it.mediaType==='image' || it.mediaType==='video'){
        try{ const cached = await getBlobLocal(it.id); if(cached) it.blob = cached.blob; }catch(e){ /* ignore */ }
      }
    }
    items = docs;
    render();
    if(!didInitialMaintenance){
      didInitialMaintenance = true;
      healOversizedThumbs();
      migrateLegacyTypes();
    }
  }, err=>{ console.error(err); showToast('동기화 오류: 인터넷 연결을 확인해주세요'); });
}
/* one-time cleanup: old items used a 7-option 유형 taxonomy (릴스/피드/캐러셀/배너/카드뉴스/스토리/기타).
   Map any of those onto the new 3-option 이미지/비디오/슬라이드 광고 taxonomy based on their actual media. */
async function migrateLegacyTypes(){
  const valid = Object.keys(TYPE_COLORS);
  const targets = items.filter(it=> !valid.includes(it.type));
  if(!targets.length) return;
  for(const it of targets){
    it.type = it.mediaType==='video' ? '비디오' : '이미지';
    await putItem(it);
  }
  render();
}
/* one-time cleanup: shrink any old image thumbnails that were saved at full resolution */
async function healOversizedThumbs(){
  const targets = items.filter(it=> it.mediaType==='image' && it.thumb && it.thumb.length > 200000);
  if(!targets.length) return;
  let changed = false;
  for(const it of targets){
    try{
      const small = await resizeImageDataUrl(it.thumb);
      if(small && small.length < it.thumb.length){ it.thumb = small; await putItem(it); changed = true; }
    }catch(e){ /* ignore */ }
  }
  if(changed) render();
}
function populateFilterOptions(){
  const ft = document.getElementById('filterType');
  Object.keys(TYPE_COLORS).forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; ft.appendChild(o); });
  const fs = document.getElementById('filterStatus');
  Object.keys(STATUS_COLORS).forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; fs.appendChild(o); });
}

/* ---------- Rendering ---------- */
function filteredItems(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const ft = document.getElementById('filterType').value;
  const fs = document.getElementById('filterStatus').value;
  return items.filter(it=>{
    if(ft && it.type!==ft) return false;
    if(fs && it.status!==fs) return false;
    if(q){
      const hay = (it.title+' '+it.campaign+' '+it.notes).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  renderMetrics();
  document.getElementById('galView').style.display = view==='gallery' ? '' : 'none';
  document.getElementById('calView').style.display = view==='cal' ? '' : 'none';
  document.getElementById('tblView').style.display = view==='tbl' ? '' : 'none';
  document.getElementById('calNav').style.visibility = view==='tbl' ? 'hidden' : 'visible';
  if(view==='gallery') renderGallery();
  else if(view==='cal') renderCalendar();
  else renderTable();
}

function renderMetrics(){
  const all = items;
  const now = new Date(); const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const thisMonth = all.filter(i=>i.date && i.date.startsWith(ym)).length;
  const done = all.filter(i=>i.status==='게시완료').length;
  const wip = all.filter(i=>i.status==='제작중').length;
  const withVideo = all.filter(i=>i.mediaType==='video').length;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="l">전체 소재</div><div class="v">${all.length}개</div></div>
    <div class="metric"><div class="l">이번 달 등록</div><div class="v accent">${thisMonth}개</div></div>
    <div class="metric"><div class="l">게시완료</div><div class="v green">${done}개</div></div>
    <div class="metric"><div class="l">제작중</div><div class="v amber">${wip}개</div></div>
    <div class="metric"><div class="l">영상 소재</div><div class="v">${withVideo}개</div></div>
  `;
}

function renderCalendar(){
  const labelEl = document.getElementById('monthLabel');
  labelEl.textContent = `${curYear}년 ${curMonth+1}월`;
  const first = new Date(curYear, curMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(curYear, curMonth, 0).getDate();
  const cells = [];
  for(let i=startWeekday-1;i>=0;i--) cells.push({d:daysInPrevMonth-i, other:true, ym:prevYM()});
  for(let d=1;d<=daysInMonth;d++) cells.push({d, other:false, ym:curYM()});
  while(cells.length % 7 !== 0 || cells.length < 42) cells.push({d:cells.length - (startWeekday+daysInMonth) + 1, other:true, ym:nextYM()});

  const fitems = filteredItems();
  const byDate = {};
  fitems.forEach(it=>{ (byDate[it.date] = byDate[it.date]||[]).push(it); });

  const wk = ['일','월','화','수','목','금','토'];
  let html = `<div class="cal-week">${wk.map(w=>`<div>${w}</div>`).join('')}</div><div class="cal-grid">`;
  const tstr = todayStr();
  cells.forEach(c=>{
    const dateStr = c.ym+'-'+String(c.d).padStart(2,'0');
    const isToday = dateStr===tstr && !c.other;
    const dayItems = byDate[dateStr] || [];
    html += `<div class="cal-cell ${c.other?'other':''} ${isToday?'today':''}" data-date="${dateStr}">
      <div class="daynum"><span class="n">${c.d}</span><span class="addbtn" data-quickadd="${dateStr}">＋</span></div>
      <div class="chiplist">`;
    dayItems.forEach(it=>{
      const color = TYPE_COLORS[it.type]||'gray';
      const thumb = it.thumb ? `<img class="thumb" src="${it.thumb}" style="object-position:${it.focusX??50}% ${it.focusY??50}%">` : `<div class="thumb novideo">${it.mediaType==='video'?'🎬':'🖼'}</div>`;
      html += `<div class="chip" draggable="true" data-id="${it.id}" title="${escapeHtml(it.title)}">
        ${thumb}<span class="dot tag-dot" style="background:var(--${color==='gray'?'muted':color==='purple'?'accent':color})"></span>
        <span class="t">${escapeHtml(it.title)}</span></div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('calView').innerHTML = html;

  // events: click chip -> edit
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=> openModal(el.dataset.id));
    el.addEventListener('dragstart', e=> e.dataTransfer.setData('text/plain', el.dataset.id));
  });
  document.querySelectorAll('.addbtn').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(null, el.dataset.quickadd); });
  });
  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', ()=> cell.classList.remove('dragover'));
    cell.addEventListener('drop', async e=>{
      e.preventDefault(); cell.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const newDate = cell.dataset.date;
      const it = items.find(x=>x.id===id);
      if(it && newDate){ it.date = newDate; await putItem(it); showToast('날짜가 변경됐어요'); render(); }
    });
  });
}
function curYM(){ return curYear+'-'+String(curMonth+1).padStart(2,'0'); }
function prevYM(){ const m = curMonth===0?11:curMonth-1; const y=curMonth===0?curYear-1:curYear; return y+'-'+String(m+1).padStart(2,'0'); }
function nextYM(){ const m = curMonth===11?0:curMonth+1; const y=curMonth===11?curYear+1:curYear; return y+'-'+String(m+1).padStart(2,'0'); }

/* ---------- Gallery view ---------- */
function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay();
  const start = new Date(d); start.setDate(d.getDate()-dow);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start, end};
}
function toISODate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekKeyOf(dateStr){ return toISODate(weekRangeOf(dateStr).start); }
function weekLabelOf(dateStr){
  const {start,end} = weekRangeOf(dateStr);
  const fmt = (d)=> `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;
  return `${fmt(start)} ~ ${fmt(end)}`;
}

function renderGallery(){
  document.getElementById('monthLabel').textContent = `${curYear}년 ${curMonth+1}월`;
  document.getElementById('dsRow').innerHTML = buildDateStripHtml();
  bindDateStripEvents();
  document.getElementById('modeWeekBtn').classList.toggle('active', dateGroupMode==='week');
  document.getElementById('modeDayBtn').classList.toggle('active', dateGroupMode==='day');

  const main = document.getElementById('galMain');
  const fitems = filteredItems();

  if(gallerySelectedDate){
    let rangeItems, label;
    if(dateGroupMode==='week'){
      const {start,end} = weekRangeOf(gallerySelectedDate);
      const startISO = toISODate(start), endISO = toISODate(end);
      rangeItems = fitems.filter(it=> it.date >= startISO && it.date <= endISO).sort(itemSortCompare);
      label = `🗓 ${weekLabelOf(gallerySelectedDate)} · ${rangeItems.length}개`;
    } else {
      rangeItems = fitems.filter(it=>it.date===gallerySelectedDate).sort(itemSortCompare);
      label = `📅 ${gallerySelectedDate} · ${rangeItems.length}개`;
    }
    let html = `<div class="gallery-hdr"><div class="t">${label}</div><a class="clear" id="galClear">✕ 전체 보기</a></div>`;
    html += rangeItems.length
      ? `<div class="gallery-grid">${rangeItems.map(gitemHtml).join('')}</div>`
      : `<div class="empty"><div class="ic">📭</div>이 기간에 등록된 소재가 없어요</div>`;
    main.innerHTML = html;
    document.getElementById('galClear').addEventListener('click', ()=>{ gallerySelectedDate=null; renderGallery(); });
  } else if(fitems.length===0){
    main.innerHTML = `<div class="empty"><div class="ic">🖼️</div>등록된 소재가 없어요<br>우측 상단 <b>+ 소재 추가</b>로 시작하거나 위 날짜에서 선택하세요</div>`;
  } else if(dateGroupMode==='week'){
    const byWeek = {};
    fitems.forEach(it=>{ const k = weekKeyOf(it.date); (byWeek[k]=byWeek[k]||[]).push(it); });
    const weeks = Object.keys(byWeek).sort((a,b)=> b.localeCompare(a));
    let html = `<div class="gallery-hdr"><div class="t">전체 모아보기(주별) · ${fitems.length}개</div></div>`;
    weeks.forEach(k=>{
      const wItems = byWeek[k].slice().sort(itemSortCompare);
      html += `<div class="gallery-daygroup"><div class="dh">${weekLabelOf(k)}</div><div class="gallery-grid">${wItems.map(gitemHtml).join('')}</div></div>`;
    });
    main.innerHTML = html;
  } else {
    const byDate = {};
    fitems.forEach(it=> (byDate[it.date] = byDate[it.date]||[]).push(it));
    const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));
    let html = `<div class="gallery-hdr"><div class="t">전체 모아보기(일별) · ${fitems.length}개</div></div>`;
    dates.forEach(d=>{
      const dayItems = byDate[d].slice().sort(itemSortCompare);
      html += `<div class="gallery-daygroup"><div class="dh">${d}</div><div class="gallery-grid">${dayItems.map(gitemHtml).join('')}</div></div>`;
    });
    main.innerHTML = html;
  }
  main.querySelectorAll('.gitem').forEach(el=> el.addEventListener('click', ()=>{ if(!el.classList.contains('was-dragged')) openLightbox(el.dataset.id); }));
  main.querySelectorAll('[data-purchase-id]').forEach(cb=>{
    cb.addEventListener('click', e=> e.stopPropagation());
    cb.addEventListener('change', async e=>{
      const id = e.target.dataset.purchaseId;
      const it = items.find(x=>x.id===id);
      if(!it) return;
      it.purchased = e.target.checked;
      await putItem(it);
      e.target.closest('.gitem').classList.toggle('purchased', it.purchased);
      showToast(it.purchased ? '구매전환 소재로 표시했어요' : '표시를 해제했어요');
    });
  });
  main.querySelectorAll('[data-slide-prev]').forEach(btn=> btn.addEventListener('click', e=>{ e.stopPropagation(); stepSlide(btn.dataset.slidePrev, -1); }));
  main.querySelectorAll('[data-slide-next]').forEach(btn=> btn.addEventListener('click', e=>{ e.stopPropagation(); stepSlide(btn.dataset.slideNext, 1); }));
  main.querySelectorAll('.gallery-grid').forEach(grid=>{
    const ids = Array.from(grid.querySelectorAll('.gitem')).map(el=>el.dataset.id);
    const groupItems = ids.map(id=> items.find(x=>x.id===id)).filter(Boolean);
    bindGalleryDrag(grid, groupItems);
  });
}
function itemSortCompare(a,b){
  if(a.order!=null && b.order!=null) return a.order-b.order;
  return (b.createdAt||0)-(a.createdAt||0);
}
function bindGalleryDrag(grid, groupItems){
  grid.querySelectorAll('.gitem').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.id);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      setTimeout(()=> el.classList.remove('was-dragged'), 0);
    });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', async e=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      el.classList.add('was-dragged');
      const srcId = e.dataTransfer.getData('text/plain');
      const targetId = el.dataset.id;
      if(!srcId || srcId===targetId) return;
      const srcIdx = groupItems.findIndex(x=>x.id===srcId);
      const tgtIdx = groupItems.findIndex(x=>x.id===targetId);
      if(srcIdx<0 || tgtIdx<0) return;
      const [moved] = groupItems.splice(srcIdx,1);
      groupItems.splice(tgtIdx,0,moved);
      groupItems.forEach((it,i)=>{ it.order = i; });
      await Promise.all(groupItems.map(it=>putItem(it)));
      showToast('순서를 변경했어요');
      renderGallery();
    });
  });
}
function gitemHtml(it){
  const tcolor = TYPE_COLORS[it.type]||'gray';
  const scolor = STATUS_COLORS[it.status]||'gray';
  let media, badge;
  if(it.mediaType==='slide' && it.slides && it.slides.length){
    const idx = slideIndex[it.id]||0;
    const n = it.slides.length;
    const s = it.slides[idx] || it.slides[0];
    media = `<img data-slide-img="${it.id}" src="${s.thumb}" loading="lazy" style="object-position:${s.focusX??50}% ${s.focusY??50}%">`;
    badge = `<div class="slide-badge" data-slide-badge="${it.id}">🖼 ${idx+1}/${n}</div>`
      + (n>1 ? `

  </div>`;
}
function stepSlide(id, dir){
  const it = items.find(x=>x.id===id);
  if(!it || !it.slides || !it.slides.length) return;
  const n = it.slides.length;
  const idx = ((slideIndex[id]||0) + dir + n) % n;
  slideIndex[id] = idx;
  const card = document.querySelector(`.gitem[data-id="${id}"]`);
  if(!card) return;
  const s = it.slides[idx];
  const img = card.querySelector('[data-slide-img]');
  if(img){ img.src = s.thumb; img.style.objectPosition = `${s.focusX??50}% ${s.focusY??50}%`; }
  const badge = card.querySelector('[data-slide-badge]');
  if(badge) badge.textContent = `🖼 ${idx+1}/${n}`;
  const dots = card.querySelector('[data-slide-dots]');
  if(dots) dots.querySelectorAll('.sdot').forEach((d,i)=> d.classList.toggle('on', i===idx));
}

function renderLbSlide(it){

  const n = it.slides.length;
  mediaEl.innerHTML = `<div class="lb-slide-wrap">
    <img src="${it.slides[idx].thumb}" style="${n>1?'cursor:pointer;':''}">
    ${n>1 ? `
      <button class="lb-slide-nav prev" id="lbSlidePrev" title="이전 (←)">‹</button>

  </div>`;
  if(n>1){
    document.getElementById('lbSlidePrev').addEventListener('click', ()=> lbStepSlide(it, -1));
    document.getElementById('lbSlideNext').addEventListener('click', ()=> lbStepSlide(it, 1));
    const imgEl = mediaEl.querySelector('img');
    imgEl.addEventListener('click', (e)=>{
      const rect = imgEl.getBoundingClientRect();
      const isLeftHalf = (e.clientX - rect.left) < rect.width/2;
      lbStepSlide(it, isLeftHalf ? -1 : 1);
    });
    let touchStartX = null;
    mediaEl.querySelector('.lb-slide-wrap').addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
    mediaEl.querySelector('.lb-slide-wrap').addEventListener('touchend', e=>{
      if(touchStartX==null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;

      touchStartX = null;
    }, {passive:true});
  }

function bindFocusPicker(){
  const picker = document.getElementById('focusPicker');
  const img = document.getElementById('focusImg');
  const dot = document.getElementById('focusDot');
  if(!picker || !img || !dot) return;
  function setFromEvent(e){
    const rect = img.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    let x = (point.clientX - rect.left) / rect.width * 100;
    let y = (point.clientY - rect.top) / rect.height * 100;
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    pendingFocusX = x; pendingFocusY = y;
    dot.style.left = x + '%';
    dot.style.top = y + '%';
  }
  function onMove(e){ setFromEvent(e); }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  picker.addEventListener('mousedown', e=>{ setFromEvent(e); document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); });
  picker.addEventListener('touchstart', e=>{ setFromEvent(e); document.addEventListener('touchmove', onMove, {passive:true}); document.addEventListener('touchend', onUp); }, {passive:true});
}

async function handleSlideFiles(files, it){

async function handleFile(file, it){
  if(!file.type.startsWith('video/') && !file.type.startsWith('image/')){
    showToast('영상 또는 이미지 파일만 업로드할 수 있어요'); return;
  }
  pendingBlob = file;
  pendingFileName = file.name;
  pendingMediaType = file.type.startsWith('video/') ? 'video' : 'image';
  mediaRemoved = false;
  pendingFocusX = 50; pendingFocusY = 50;
  if(pendingMediaType==='video'){
    pendingThumb = await grabVideoThumb(file);
  } else {
    const rawDataUrl = await new Promise(res=>{
      const reader = new FileReader();
      reader.onload = ()=> res(reader.result);
      reader.readAsDataURL(file);
    });
    pendingThumb = await resizeImageDataUrl(rawDataUrl);
  }
  renderMediaArea(it);
}
function resizeImageDataUrl(dataUrl, maxW){
  maxW = maxW || 480;
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      try{
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
/* Firestore documents are capped at 1MiB; shrink slide thumbnails further if a
   many-slide or high-detail set of images would risk exceeding that budget. */
async function ensureSlidesFitFirestore(slides){
  let arr = slides;
  let width = 640;
  for(let iter=0; iter<5; iter++){
    const total = arr.reduce((s,x)=> s + (x.thumb ? x.thumb.length : 0), 0);
    if(total <= 900000) return arr;
    width = Math.round(width * 0.7);
    const next = [];
    for(const s of arr){ next.push({ ...s, thumb: await resizeImageDataUrl(s.thumb, width) }); }
    arr = next;
  }
  return arr;
}
function grabVideoThumb(file){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.src = URL.createObjectURL(file);
    video.muted = true;
    video.addEventListener('loadeddata', ()=>{
      try{ video.currentTime = Math.min(0.2, (video.duration||1)/4); }catch(e){ resolve(null); }
    });
    video.addEventListener('seeked', ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = Math.round(320 * (video.videoHeight/video.videoWidth || 0.56));
      const ctx = canvas.getContext('2d');
      try{
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      }catch(e){ resolve(null); }
      URL.revokeObjectURL(video.src);
    });
    video.addEventListener('error', ()=> resolve(null));
    setTimeout(()=>{ if(video.readyState < 2) resolve(null); }, 4000);
  });
}

async function saveModal(){
  const title = document.getElementById('f_title').value.trim();
  const date = document.getElementById('f_date').value;
  const type = document.getElementById('f_type').value;
  if(!title){ showToast('제목을 입력해주세요'); return; }
  if(!date){ showToast('일자를 선택해주세요'); return; }
  if(type==='슬라이드 광고' && pendingSlides.length===0){ showToast('슬라이드 이미지를 1장 이상 등록해주세요'); return; }

  let it = editingId ? items.find(x=>x.id===editingId) : null;
  const isNew = !it;
  if(isNew){ it = { id: uuid(), createdAt: Date.now() }; }

  it.date = date;
  it.title = title;
  it.campaign = document.getElementById('f_campaign').value.trim();
  it.type = type;
  it.platform = document.getElementById('f_platform').value;
  it.status = document.getElementById('f_status').value;
  it.cta = document.getElementById('f_cta').value.trim();
  it.creator = document.getElementById('f_creator').value.trim();
  it.notes = document.getElementById('f_notes').value.trim();

  if(type==='슬라이드 광고'){
    it.slides = await ensureSlidesFitFirestore(pendingSlides.slice());
    it.mediaType = 'slide';
    it.blob = null;
    it.mediaName = null;
    it.thumb = it.slides[0].thumb;
    it.focusX = it.slides[0].focusX; it.focusY = it.slides[0].focusY;
    await delBlobLocal(it.id);
  } else {
    it.slides = null;
    if(pendingBlob){
      it.blob = pendingBlob; it.mediaType = pendingMediaType; it.mediaName = pendingFileName; it.thumb = pendingThumb;
      try{ await putBlobLocal(it.id, pendingBlob, pendingMediaType, pendingFileName); }catch(e){ /* ignore */ }
    } else if(mediaRemoved){
      it.blob = null; it.mediaType = 'none'; it.mediaName = null; it.thumb = null;
      await delBlobLocal(it.id);
    }
    if(it.thumb){ it.focusX = pendingFocusX; it.focusY = pendingFocusY; }
  }

  await putItem(it);
  if(isNew) items.push(it);
  showToast(isNew ? '소재를 추가했어요' : '저장했어요');
  closeModal();
  render();
}
async function deleteModal(){
  if(!editingId) return;
  if(!confirm('이 소재를 삭제할까요?')) return;
  await delItem(editingId);
  items = items.filter(i=>i.id!==editingId);
  showToast('삭제했어요');
  closeModal();
  render();
}

/* ---------- CSV export ---------- */
function exportCSV(){
  const rows = [['일자','제목','캠페인','유형','매체','상태','제작자','CTA','메모','미디어유형','파일명']];
  filteredItems().forEach(it=>{
    rows.push([it.date,it.title,it.campaign,it.type,it.platform,it.status,it.creator||'',it.cta,it.notes,it.mediaType,it.mediaName||'']);
  });
  const csv = rows.map(r=> r.map(v=> '"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ad_creative_calendar.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Events ---------- */
function bindEvents(){
  document.getElementById('viewGalBtn').addEventListener('click', ()=>{ view='gallery'; toggleSeg(); render(); });
  document.getElementById('viewCalBtn').addEventListener('click', ()=>{ view='cal'; toggleSeg(); render(); });
  document.getElementById('viewTblBtn').addEventListener('click', ()=>{ view='tbl'; toggleSeg(); render(); });
  document.getElementById('prevBtn').addEventListener('click', ()=>{ curMonth--; if(curMonth<0){curMonth=11;curYear--;} render(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ curMonth++; if(curMonth>11){curMonth=0;curYear++;} render(); });
  document.getElementById('todayBtn').addEventListener('click', ()=>{ const n=new Date(); curYear=n.getFullYear(); curMonth=n.getMonth(); render(); });
  document.getElementById('addBtn').addEventListener('click', ()=> openModal(null));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', saveModal);
  document.getElementById('deleteBtn').addEventListener('click', deleteModal);
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeLightbox(); });
  document.getElementById('lbEditBtn').addEventListener('click', ()=>{ const id = lightboxId; closeLightbox(); openModal(id); });
  document.getElementById('modeWeekBtn').addEventListener('click', ()=>{ dateGroupMode='week'; renderGallery(); });
  document.getElementById('modeDayBtn').addEventListener('click', ()=>{ dateGroupMode='day'; renderGallery(); });
  document.getElementById('exportBtn').addEventListener('click', exportCSV);
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('filterType').addEventListener('change', render);
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('f_type').addEventListener('change', ()=>{
    updateFileInputAccept();
    renderMediaArea(editingId ? items.find(x=>x.id===editingId) : null);
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      if(document.getElementById('lightbox').classList.contains('show')) closeLightbox();
      else if(document.getElementById('overlay').classList.contains('show')) closeModal();
      return;
    }
    if((e.key==='ArrowLeft' || e.key==='ArrowRight') && document.getElementById('lightbox').classList.contains('show') && lightboxId){
      const it = items.find(x=>x.id===lightboxId);
      if(it && it.mediaType==='slide' && it.slides && it.slides.length>1){
        e.preventDefault();
        lbStepSlide(it, e.key==='ArrowRight' ? 1 : -1);
      }
    }
  });
}
function toggleSeg(){
  document.getElementById('viewGalBtn').classList.toggle('active', view==='gallery');
  document.getElementById('viewCalBtn').classList.toggle('active', view==='cal');
  document.getElementById('viewTblBtn').classList.toggle('active', view==='tbl');
}

init();
</script>
